{% extends "cards/_card.svg" %}
{% block body %}
{% for line in message_lines %}<text y="{{ 15 + loop.index0 * 19 }}" font-size="13" font-style="italic">{{ line }}</text>
{% endfor %}
{% set y = message_lines|length * 19 %}
<text y="{{ y + 14 }}" class="muted" font-size="11">{{ signed }}</text>
{% set y = y + 22 %}
<line class="rule" x2="{{ inner }}" y1="{{ y + 8.5 }}" y2="{{ y + 8.5 }}"/>
<text y="{{ y + 26 }}" class="accent" font-size="11">{{ '{:,}'.format(total) }} signature{{ 's' if total != 1 }} · sign it at {{ host }}/guestbook</text>
{% endblock %}
