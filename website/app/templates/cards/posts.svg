{% extends "cards/_card.svg" %}
{% block body %}
{% for date, title in posts %}
{% set y = loop.index0 * 24 %}
{% if not loop.first %}<line class="rule" x2="{{ inner }}" y1="{{ y + 0.5 }}" y2="{{ y + 0.5 }}"/>{% endif %}
<circle cx="3" cy="{{ y + 12 }}" r="2.5" class="accent"/>
<text x="14" y="{{ y + 16 }}" font-size="12">{{ title }}</text>
<text x="{{ inner }}" y="{{ y + 16 }}" class="muted" font-size="11" text-anchor="end">{{ date }}</text>
{% endfor %}
{% endblock %}
