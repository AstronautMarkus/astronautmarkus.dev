{% extends "cards/_card.svg" %}
{% block body %}
{% for value, label in stats %}
{% set x = ((loop.index0 % 3) * inner / 3)|round(1) %}{% set y = (loop.index0 // 3) * 48 %}
<text x="{{ x }}" y="{{ y + 18 }}" font-size="18" font-weight="600">{{ value }}</text>
<text x="{{ x }}" y="{{ y + 34 }}" class="muted" font-size="11">{{ label }}</text>
{% endfor %}
{% endblock %}
