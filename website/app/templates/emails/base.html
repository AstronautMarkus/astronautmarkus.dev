<!DOCTYPE html>
<html lang="{{ lang|default('en') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block subject_title %}AstronautMarkus.Dev{% endblock %}</title>
    <style>
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            margin: 0 0 16px;
            color: #000000;
        }

        h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            margin: 22px 0 8px;
            color: #000000;
        }

        p {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 12px;
            color: #222222;
        }

        a {
            color: #009ddc;
        }

        blockquote {
            border-left: 3px solid #cccccc;
            margin: 12px 0;
            padding: 4px 16px;
            color: #555555;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
        }

        table.data-table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
            font-size: 13px;
        }

        table.data-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #dddddd;
            vertical-align: top;
        }

        table.data-table td.label {
            font-weight: bold;
            white-space: nowrap;
            padding-right: 16px;
        }
    </style>
</head>

<body style="margin:0;padding:24px 0;background-color:#c0c0c0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#c0c0c0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                    style="width:600px;max-width:600px;background-color:#ffffff;border:2px solid #000000;">
                    <tr>
                        <td>
                            <img src="{{ banner_url }}" alt="AstronautMarkus.Dev" width="600"
                                style="display:block;width:100%;max-width:600px;height:auto;border-bottom:2px solid #000000;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px 32px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0;line-height:0;font-size:0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                style="border-collapse:collapse;">
                                <tr>
                                    <td width="17%" style="background-color:#61bb46;height:5px;line-height:5px;font-size:0;">&nbsp;</td>
                                    <td width="17%" style="background-color:#fdb827;height:5px;line-height:5px;font-size:0;">&nbsp;</td>
                                    <td width="17%" style="background-color:#f5821f;height:5px;line-height:5px;font-size:0;">&nbsp;</td>
                                    <td width="16%" style="background-color:#e03a3e;height:5px;line-height:5px;font-size:0;">&nbsp;</td>
                                    <td width="17%" style="background-color:#963d97;height:5px;line-height:5px;font-size:0;">&nbsp;</td>
                                    <td width="16%" style="background-color:#009ddc;height:5px;line-height:5px;font-size:0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px;background-color:#eeeeee;text-align:center;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
                            {% block footer %}
                            <p style="margin:0 0 4px;font-size:11px;color:#666666;">
                                {% if lang == 'es' %}Este es un mensaje automático — por favor no respondas a este correo.{% else %}This is an automated message — please do not reply to this email.{% endif %}
                            </p>
                            <p style="margin:0;font-size:11px;">
                                <a href="{{ app_url }}" style="color:#009ddc;text-decoration:none;font-weight:bold;">{{ app_url_display }}</a>
                            </p>
                            {% endblock %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
